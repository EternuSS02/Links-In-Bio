           transform: translateX(-50%) translateZ(80px); filter: drop-shadow(0 18px 24px rgba(0,0,0,.6)) drop-shadow(0 0 18px color-mix(in srgb, var(--glow-1) 60%, transparent)); }
  /* little floating sparks for depth (purely decorative, delete if you don't like them) */

  /* NAME: glowing neon text */

       text-shadow: 0 0 8px rgba(255,255,255,.6), 0 0 24px var(--glow-1), 0 0 52px var(--glow-1); }

/* LIVE / OFFLINE pill: switches automatically (see script) */

@keyframes beat { 50% { box-shadow: 0 0 40px var(--glow-1); } }

  /* SOCIAL ICON ROW */
  .socials { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 26px 0 8px; padding: 0; list-style: none; }

  .link { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 62px; padding: 14px 20px;

  .link:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 0 34px var(--glow-1), 0 0 70px color-mix(in srgb, var(--glow-2) 50%, transparent); }

<script>

const TWITCH_CHANNEL = "eternussxx";   // the LIVE NOW button shows automatically when this channel is live

/* Icon row. url "#" = fill in later. icon: path to a logo image, "" = shows the letter */

 // { name: "Twitch",    letter: "T", url: "twitch.tv/eternussxx", icon: "twitch.png" },
  { name: "Kick",      letter: "K", url: "#", icon: "kick.png" },

  { name: "TikTok",    letter: "♪", url: "https://www.tiktok.com/@eternussxx", icon: "tiktok.png" },
  { name: "Instagram", letter: "I", url: "https://www.instagram.com/eternussxx/", icon: "instagram.png" },
  { name: "X",         letter: "X", url: "https://x.com/eternussx", icon: "x.png" },
 // { name: "Discord",   letter: "D", url: "https://discord.gg/6kTVY9B5HR", icon: "discord.png" },
];

/* Big buttons, top to bottom. First one is styled larger. thumb: small image or "" */
const LINKS = [
  { label: "Watch me live", url: "https://www.twitch.tv/eternussxx", thumb: "TwitchGLITCH-4x.gif" },
  { label: "YouTube",       url: "https://www.youtube.com/@eternussxx", thumb: "youtube-4x.gif" },
  { label: "Join the Discord", url: "https://discord.gg/6kTVY9B5HR", thumb: "discord-4x.gif" },
  // { label: "Merch", url: "#", thumb: "" },   // copy a line to add more
];
/* ========================================================== */

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* LIVE NOW button: checks Twitch automatically */
const live = document.getElementById("live");
live.href = "https://twitch.tv/" + TWITCH_CHANNEL;

function setLive(isLive) {
  live.classList.toggle("on", isLive);
  live.textContent = isLive ? "● LIVE" : "● OFFLINE";   // EDIT: change the wording if you like
}

async function checkLive() {
  try {
    const r = await fetch("https://decapi.me/twitch/uptime/" + TWITCH_CHANNEL);
    const t = (await r.text()).toLowerCase();
    setLive(r.ok && !t.includes("offline") && !t.includes("error") && !t.includes("not found"));
  } catch (e) {
    setLive(false);
  }
}
checkLive();
setInterval(checkLive, 60000);   // re-checks every minute while the page is open

document.getElementById("socials").innerHTML = SOCIALS.map(s =>
  `<li><a href="${esc(s.url)}" target="_blank" rel="noopener" aria-label="${esc(s.name)}">${s.icon ? `<img src="${esc(s.icon)}" alt="">` : esc(s.letter)}</a></li>`).join("");

document.getElementById("links").innerHTML = LINKS.map((l, i) =>
  `<li><a class="link${i === 0 ? " main" : ""}" href="${esc(l.url)}" target="_blank" rel="noopener">${l.thumb ? `<img class="thumb" src="${esc(l.thumb)}" alt="">` : ""}${esc(l.label)}</a></li>`).join("");

/* 3D tilt: mouse on desktop, device tilt on phone (iOS asks permission on first tap) */
const stage = document.getElementById("stage"), tilt = document.getElementById("tilt");
const set = (x, y) => tilt.style.transform = `rotateY(${x * 16}deg) rotateX(${-y * 12}deg)`;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!reduce) {
  window.addEventListener("pointermove", e => set(e.clientX / innerWidth - .5, e.clientY / innerHeight - .5));
  window.addEventListener("pointerleave", () => set(0, 0));
  const orient = e => { if (e.gamma != null) set(Math.max(-.5, Math.min(.5, e.gamma / 45)), Math.max(-.5, Math.min(.5, (e.beta - 45) / 60))); };
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") {
    stage.addEventListener("click", () => DeviceOrientationEvent.requestPermission().then(r => r === "granted" && addEventListener("deviceorientation", orient)).catch(() => {}), { once: true });
  } else addEventListener("deviceorientation", orient);
}

const bg = document.querySelector(".bg");

let targetY = 0;
let currentY = 0;

window.addEventListener("scroll", () => {
    targetY = window.scrollY * 0.25;
}, { passive: true });

function animateBackground() {
    currentY += (targetY - currentY) * 0.08;

    bg.style.transform = `translate3d(0, ${currentY}px, 0)`;

    requestAnimationFrame(animateBackground);
}

animateBackground();
</script>
